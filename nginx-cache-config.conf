# Nginx Cache Configuration for thesolowardrobe.com
# Add these location blocks to your nginx config at /etc/nginx/sites-available/thesolowardrobe.com

# Cache images with long lifetime (1 year)
location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Cache fonts with long lifetime
location ~* \.(woff|woff2|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Cache CSS and JS with long lifetime (1 year for hashed files)
location ~* \.(css|js)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Cache JSON data files (products.json, etc.) - shorter cache for data that might change
location ~* \.(json)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
}

# Cache manifest and other web app files
location ~* \.(webmanifest|xml|txt)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Cache static assets directory (already hashed files)
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Cache hero.webp specifically (large file, should cache long)
location = /hero.webp {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Cache favicon and other root assets
location ~* ^/(favicon\.png|robots\.txt|sitemap\.xml|manifest\.webmanifest)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

