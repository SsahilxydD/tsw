name = "whatsapp-auto-sender"
main = "whatsapp-auto-sender.js"
compatibility_date = "2024-01-01"

# Cron trigger - runs every hour
[triggers]
crons = ["0 * * * *"]

# KV namespace for storing sent product IDs
[[kv_namespaces]]
binding = "SENT_PRODUCTS"
id = "7fad536eb99f47e09522651b18af732a"  # Will be created during setup

# Environment variables (secrets - set via wrangler)
# Set secrets via: wrangler secret put TWILIO_ACCOUNT_SID
# Set secrets via: wrangler secret put TWILIO_AUTH_TOKEN
# Set secrets via: wrangler secret put TWILIO_WHATSAPP_FROM
# Set secrets via: wrangler secret put WHATSAPP_BROADCAST_TO
