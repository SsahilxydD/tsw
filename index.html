<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="description" content="Solo Wardrobe – honest prices, curated drops. Shop easy-to-wear pieces that last." />
    <title>Solo Wardrobe</title>
    <script>
      // Clean up deprecated apple meta and block any GA/gtm network calls (from stale SW or third-parties)
      (function(){
        try {
          var old = document.querySelector('meta[name="apple-mobile-web-app-capable"]');
          if (old && old.parentNode) old.parentNode.removeChild(old);
          var blocked = ['www.google-analytics.com','www.googletagmanager.com'];
          var ofetch = window.fetch;
          if (typeof ofetch === 'function') {
            window.fetch = function(input, init){
              try {
                var url = (typeof input === 'string') ? input : (input && input.url) || '';
                if (blocked.some(function(h){ return url.indexOf(h) !== -1; })) {
                  return Promise.resolve(new Response('', { status: 204, statusText: 'No Content' }));
                }
              } catch (e) {}
              return ofetch.apply(this, arguments);
            };
          }
          var obeacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
          if (obeacon) {
            navigator.sendBeacon = function(url, data){
              try { if (['www.google-analytics.com','www.googletagmanager.com'].some(function(h){ return String(url||'').indexOf(h) !== -1; })) return true; } catch (e) {}
              return obeacon(url, data);
            };
          }
          // Do not unregister service workers here; leave control to app hosting
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
