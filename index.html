<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preload LCP hero image for faster initial render -->
    <link rel="preload" href="/hero.webp" as="image" type="image/webp" fetchpriority="high" />
    
    <!-- Preload critical resources to break the network chain -->
    <link rel="preload" href="/data/products.json" as="fetch" crossorigin="anonymous" />
    
    <!-- DNS prefetch for faster subsequent requests -->
    <link rel="dns-prefetch" href="https://thesolowardrobe.com" />
    
    <!-- Font preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts with display=swap to prevent render blocking -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400;600&display=swap" /></noscript>
    <meta name="description" content="Solo Wardrobe – honest prices, curated drops. Shop easy-to-wear pieces that last." />
    <title>Solo Wardrobe</title>

    <!-- Structured Data for Google Search Features -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://thesolowardrobe.com/#organization",
          "name": "Solo Wardrobe",
          "url": "https://thesolowardrobe.com",
          "logo": {
            "@type": "ImageObject",
            "@id": "https://thesolowardrobe.com/#logo",
            "url": "https://thesolowardrobe.com/favicon.png",
            "contentUrl": "https://thesolowardrobe.com/favicon.png",
            "width": 192,
            "height": 192,
            "caption": "Solo Wardrobe"
          },
          "image": {
            "@id": "https://thesolowardrobe.com/#logo"
          },
          "description": "Solo Wardrobe – honest prices, curated drops. Shop easy-to-wear pieces that last.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://thesolowardrobe.com/#website",
          "url": "https://thesolowardrobe.com",
          "name": "Solo Wardrobe",
          "description": "Solo Wardrobe – honest prices, curated drops. Shop easy-to-wear pieces that last.",
          "publisher": {
            "@id": "https://thesolowardrobe.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://thesolowardrobe.com/collection?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "WebPage",
          "@id": "https://thesolowardrobe.com/#webpage",
          "url": "https://thesolowardrobe.com",
          "name": "Solo Wardrobe - Premium Fashion at Honest Prices",
          "isPartOf": {
            "@id": "https://thesolowardrobe.com/#website"
          },
          "about": {
            "@id": "https://thesolowardrobe.com/#organization"
          },
          "description": "Solo Wardrobe – honest prices, curated drops. Shop easy-to-wear pieces that last.",
          "inLanguage": "en-IN"
        }
      ]
    }
    </script>

    <!-- Enhanced SEO Meta Tags -->
    <meta property="og:site_name" content="Solo Wardrobe" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thesolowardrobe.com" />
    <meta property="og:title" content="Solo Wardrobe - Premium Fashion at Honest Prices" />
    <meta property="og:description" content="Solo Wardrobe – honest prices, curated drops. Shop easy-to-wear pieces that last." />
    <meta property="og:image" content="https://thesolowardrobe.com/og-default.jpg" />
    <meta property="og:image:secure_url" content="https://thesolowardrobe.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Critical inline CSS for faster FCP - renders basic layout before main CSS loads -->
    <style>
      /* Critical above-the-fold styles */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-font-smoothing: antialiased; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; color: #1a1a1a; }
      #root { min-height: 100vh; }
      /* Hero placeholder - matches actual hero dimensions */
      .hero-placeholder { width: 100%; height: 85vh; background: #000; }
      @media (min-width: 640px) { .hero-placeholder { height: 95vh; } }
      /* Skeleton animation */
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .skeleton { background: #e5e7eb; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>

    <script>
      // Clean up deprecated apple meta and block any GA/gtm network calls (from stale SW or third-parties)
      (function(){
        try {
          var old = document.querySelector('meta[name="apple-mobile-web-app-capable"]');
          if (old && old.parentNode) old.parentNode.removeChild(old);
          var blocked = ['www.google-analytics.com','www.googletagmanager.com'];
          var ofetch = window.fetch;
          if (typeof ofetch === 'function') {
            window.fetch = function(input, init){
              try {
                var url = (typeof input === 'string') ? input : (input && input.url) || '';
                if (blocked.some(function(h){ return url.indexOf(h) !== -1; })) {
                  return Promise.resolve(new Response('', { status: 204, statusText: 'No Content' }));
                }
              } catch (e) {}
              return ofetch.apply(this, arguments);
            };
          }
          var obeacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
          if (obeacon) {
            navigator.sendBeacon = function(url, data){
              try { if (['www.google-analytics.com','www.googletagmanager.com'].some(function(h){ return String(url||'').indexOf(h) !== -1; })) return true; } catch (e) {}
              return obeacon(url, data);
            };
          }
          // Do not unregister service workers here; leave control to app hosting
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
